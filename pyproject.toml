[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-partition-research"
version = "0.1.0"
description = "Validated circuit cutting and reconstruction foundations for research"
requires-python = ">=3.12,<3.13"
dependencies = [
  "qiskit>=2.1,<3",
  "qiskit-aer>=0.17,<0.18",
  "qiskit-addon-cutting>=0.10,<0.11",
  "numpy>=2,<3",
  "scipy>=1.15,<2",
  "networkx>=3.4,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
plots = ["matplotlib>=3.9,<4"]
# Commercial solver, requires a separate license (e.g. Gurobi WLS); optional
# MILP verification backend (src/qpartition/milp.py) -- scipy.optimize.milp
# (HiGHS) is the dependency-free default and needs nothing extra installed.
milp-gurobi = ["gurobipy>=12,<14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
